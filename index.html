<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سازنده ترکیب فوتبال</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0a1118;
    --pitch-green: #0d2b2b;
    --pitch-green-light: #113a3a;
    --pitch-line: rgba(255, 255, 255, 0.15);
    --accent: #00d8a0;
    --text-main: #ffffff;
    --text-sub: #8fa3c0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Vazirmatn', 'Montserrat', sans-serif;
    background: var(--bg-dark);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(0, 216, 160, 0.15), transparent 60%),
      linear-gradient(180deg, #0a1118 0%, #060a12 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
    overflow-x: hidden;
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    background: rgba(13, 43, 43, 0.6);
    backdrop-filter: blur(10px);
    padding: 10px 15px;
    border-radius: 12px;
    border: 1px solid rgba(0, 216, 160, 0.2);
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .brand {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 18px;
    font-style: italic;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand span { color: var(--accent); }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  
  select, input[type="text"], input[type="number"] {
    font-family: 'Vazirmatn', sans-serif;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    outline: none;
    transition: 0.3s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  select option { background: #0a1118; }

  .btn {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #00d8a0, #00a87d);
    color: #000;
    font-weight: 700;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.3s;
    box-shadow: 0 4px 15px rgba(0, 216, 160, 0.3);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 216, 160, 0.5); }
  .btn.ghost { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: none; }
  .btn.ghost:hover { background: rgba(255, 255, 255, 0.2); }

  /* ============ BOARD CONTAINER ============ */
  .board-container {
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
  }

  /* ============ PITCH & HEADER ============ */
  .pitch-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 0.75;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 100px rgba(0,0,0,0.5);
    border: 1px solid rgba(0, 216, 160, 0.2);
    background: var(--pitch-green);
    display: flex;
    flex-direction: column;
  }

  /* Modern Pitch Background */
  .pitch-bg {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(90deg, transparent 50%, rgba(0, 216, 160, 0.03) 50%),
      linear-gradient(180deg, rgba(0, 216, 160, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 216, 160, 0.05) 1px, transparent 1px);
    background-size: 10px 10px, 20px 20px, 20px 20px;
    z-index: 0;
  }
  .pitch-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.6) 100%);
  }

  /* Pitch Lines */
  .pitch-lines {
    position: absolute;
    inset: 4%;
    border: 2px solid var(--pitch-line);
    border-radius: 10px;
    z-index: 1;
    pointer-events: none;
  }
  .pitch-lines .center-line {
    position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--pitch-line);
  }
  .pitch-lines .center-circle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 25%; aspect-ratio: 1; border: 2px solid var(--pitch-line); border-radius: 50%;
  }
  .pitch-lines .penalty-box {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 50%; height: 16%; border: 2px solid var(--pitch-line);
  }
  .pitch-lines .penalty-box.top { top: 0; border-top: none; }
  .pitch-lines .penalty-box.bottom { bottom: 0; border-bottom: none; }
  .pitch-lines .six-yard-box {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 25%; height: 7%; border: 2px solid var(--pitch-line);
  }
  .pitch-lines .six-yard-box.top { top: 0; border-top: none; }
  .pitch-lines .six-yard-box.bottom { bottom: 0; border-bottom: none; }
  .pitch-lines .penalty-spot {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; background: var(--pitch-line); border-radius: 50%;
  }
  .pitch-lines .penalty-spot.top { top: 12%; }
  .pitch-lines .penalty-spot.bottom { bottom: 12%; }

  /* Team Header on Pitch */
  .pitch-header {
    position: absolute;
    top: 4%;
    left: 5%;
    z-index: 10;
    text-align: left;
  }
  .team-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 32px);
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    line-height: 1;
  }
  .formation-badge {
    display: inline-block;
    background: var(--accent);
    color: #000;
    font-weight: 900;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-top: 5px;
    font-family: 'Montserrat', sans-serif;
  }

  /* ============ PLAYERS GRID ============ */
  .players-grid {
    position: absolute;
    inset: 0;
    z-index: 5;
  }

  /* ============ CARD DESIGN (SHIELD SHAPE) ============ */
  .card {
    position: absolute;
    width: clamp(60px, 12vw, 85px);
    height: clamp(80px, 16vw, 115px);
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s;
    user-select: none;
    clip-path: polygon(0 0, 100% 0, 100% 70%, 50% 100%, 0 70%);
    background: #2a2a2a;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 5px;
  }
  .card:hover {
    transform: translate(-50%, -50%) scale(1.1);
    z-index: 50;
    filter: brightness(1.2);
  }

  /* Card Types (Colors) */
  .card.type-normal { background: linear-gradient(135deg, #4a4a4a, #1a1a1a); border: 1px solid #666; }
  .card.type-bronze { background: linear-gradient(135deg, #cd7f32, #8b4513); border: 1px solid #e8a86f; }
  .card.type-silver { background: linear-gradient(135deg, #e0e0e0, #9e9e9e); border: 1px solid #fff; }
  .card.type-gold   { background: linear-gradient(135deg, #ffd700, #b8860b); border: 1px solid #fff4c9; }
  .card.type-totw   { background: linear-gradient(135deg, #333, #000); border: 1px solid #ffd700; }
  .card.type-toty   { background: linear-gradient(135deg, #1e3a8a, #0f172a); border: 1px solid #60a5fa; }
  .card.type-hero   { background: linear-gradient(135deg, #ff4500, #8b0000); border: 1px solid #ffb894; }
  .card.type-legend { background: linear-gradient(135deg, #8a2be2, #4b0082); border: 1px solid #d8b4fe; }
  .card.type-icon   { background: linear-gradient(135deg, #ffffff, #a0a0a0); border: 1px solid #fff; }

  /* Card Elements */
  .card-rating {
    position: absolute;
    top: 4px;
    right: 4px;
    background: #00d8a0;
    color: #000;
    font-weight: 900;
    font-size: clamp(10px, 2vw, 14px);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: 'Montserrat', sans-serif;
    z-index: 20;
    box-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }
  .card-pos {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: clamp(8px, 1.5vw, 11px);
    font-weight: 900;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    z-index: 20;
    font-family: 'Montserrat', sans-serif;
  }
  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .card-img-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: rgba(255,255,255,0.2);
    position: absolute;
    inset: 0;
    z-index: 1;
  }
  .card-gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 40%, transparent 70%, rgba(0,0,0,0.3) 100%);
    z-index: 2;
  }
  .card-name {
    position: absolute;
    bottom: 5px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(8px, 1.8vw, 12px);
    font-weight: 700;
    color: #fff;
    z-index: 3;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
    font-family: 'Montserrat', sans-serif;
  }
  .card-flag {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(10px, 2vw, 16px);
    z-index: 3;
  }

  /* ============ BENCH ============ */
  .bench-container {
    width: 100%;
    background: rgba(13, 43, 43, 0.6);
    border: 1px solid rgba(0, 216, 160, 0.2);
    border-radius: 15px;
    padding: 12px;
    backdrop-filter: blur(10px);
  }
  .bench-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .bench-title::before {
    content: '';
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
  }
  .bench-slots {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
  }
  .bench-slots::-webkit-scrollbar { height: 6px; }
  .bench-slots::-webkit-scrollbar-thumb { background: rgba(0, 216, 160, 0.3); border-radius: 3px; }
  .bench-slots .card {
    position: relative;
    transform: none;
    top: auto !important;
    left: auto !important;
    flex: 0 0 auto;
    width: 70px;
    height: 95px;
  }
  .bench-slots .card:hover { transform: scale(1.1); }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 15px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #0d1a26;
    border: 1px solid rgba(0, 216, 160, 0.3);
    border-radius: 15px;
    width: 100%;
    max-width: 400px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    animation: pop 0.3s ease;
  }
  @keyframes pop { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-box h3 { font-size: 16px; font-weight: 900; margin-bottom: 15px; color: #fff; text-align: center; }
  
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px; color: #fff; font-family: inherit; font-size: 14px;
  }
  .form-group input[type="file"] { padding: 8px; font-size: 12px; }
  
  .row { display: flex; gap: 10px; }
  .row .form-group { flex: 1; }

  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .modal-actions .btn { flex: 1; padding: 12px; }
  .btn-danger { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); }
  .btn-danger:hover { background: rgba(239, 68, 68, 0.4); }

  /* Responsive */
  @media (max-width: 600px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .brand { text-align: center; justify-content: center; }
    .controls { flex-direction: column; }
    .controls select, .controls input, .controls .btn { width: 100%; }
    .pitch-wrapper { aspect-ratio: 0.7; }
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div class="toolbar">
  <div class="brand">⚽ <span>LINEUP</span> BUILDER</div>
  <div class="controls">
    <select id="formationSelect">
      <option value="4-2-3-1">4-2-3-1</option>
      <option value="4-3-3">4-3-3</option>
      <option value="4-4-2">4-4-2</option>
      <option value="3-5-2">3-5-2</option>
      <option value="5-3-2">5-3-2</option>
    </select>
    <input type="text" id="teamNameInput" value="MADRID TV SHOW" maxlength="20" placeholder="نام تیم">
    <button class="btn" id="exportBtn">📥 دانلود عکس</button>
    <button class="btn ghost" id="resetBtn">↺ ریست</button>
  </div>
</div>

<!-- Main Board -->
<div class="board-container" id="board">
  
  <!-- Pitch -->
  <div class="pitch-wrapper" id="pitch">
    <div class="pitch-bg"></div>
    <div class="pitch-lines">
      <div class="center-line"></div>
      <div class="center-circle"></div>
      <div class="penalty-box top"></div>
      <div class="penalty-box bottom"></div>
      <div class="six-yard-box top"></div>
      <div class="six-yard-box bottom"></div>
      <div class="penalty-spot top"></div>
      <div class="penalty-spot bottom"></div>
    </div>
    
    <!-- Team Header -->
    <div class="pitch-header">
      <div class="team-title" id="teamTitleDisplay">MADRID TV SHOW</div>
      <div class="formation-badge" id="formationBadge">4-2-3-1</div>
    </div>

    <!-- Players Grid -->
    <div class="players-grid" id="playersGrid"></div>
  </div>

  <!-- Bench -->
  <div class="bench-container">
    <div class="bench-title">نیمکت / بازیکنان تعویضی</div>
    <div class="bench-slots" id="benchSlots"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3 id="modalTitle">ویرایش بازیکن</h3>
    
    <div class="form-group">
      <label>عکس بازیکن (اختیاری)</label>
      <input type="file" id="photoInput" accept="image/*">
    </div>
    <div class="row">
      <div class="form-group">
        <label>نام بازیکن</label>
        <input type="text" id="nameInput" placeholder="مثلاً: MBAPPÉ" maxlength="15">
      </div>
      <div class="form-group">
        <label>پرچم (ایموجی)</label>
        <input type="text" id="flagInput" placeholder="🇫🇷" maxlength="4">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>پست</label>
        <input type="text" id="posInput" placeholder="ST" maxlength="4">
      </div>
      <div class="form-group">
        <label>نمره (0-10)</label>
        <input type="number" id="ratingInput" min="0" max="10" step="0.5" value="0">
      </div>
    </div>
    <div class="form-group">
      <label>نوع کارت</label>
      <select id="typeSelect">
        <option value="normal">عادی (تیره)</option>
        <option value="bronze">برنزی</option>
        <option value="silver">نقره‌ای</option>
        <option value="gold">طلایی</option>
        <option value="totw">تیم هفته (مشکی-طلایی)</option>
        <option value="toty">تیم فصل (آبی)</option>
        <option value="hero">قهرمان (نارنجی)</option>
        <option value="legend">لجند (بنفش)</option>
        <option value="icon">آیکون (سفید)</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn ghost" id="cancelBtn">انصراف</button>
      <button class="btn btn-danger" id="deleteBtn">حذف عکس</button>
      <button class="btn" id="saveBtn">ذخیره</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
  // ==================== DATA ====================
  const FORMATIONS = {
    '4-2-3-1': [
      { pos: 'GK', x: 50, y: 90 },
      { pos: 'LB', x: 15, y: 72 }, { pos: 'CB', x: 38, y: 76 }, { pos: 'CB', x: 62, y: 76 }, { pos: 'RB', x: 85, y: 72 },
      { pos: 'CDM', x: 35, y: 55 }, { pos: 'CDM', x: 65, y: 55 },
      { pos: 'LW', x: 15, y: 32 }, { pos: 'CAM', x: 50, y: 36 }, { pos: 'RW', x: 85, y: 32 },
      { pos: 'ST', x: 50, y: 15 }
    ],
    '4-3-3': [
      { pos: 'GK', x: 50, y: 90 },
      { pos: 'LB', x: 15, y: 72 }, { pos: 'CB', x: 38, y: 76 }, { pos: 'CB', x: 62, y: 76 }, { pos: 'RB', x: 85, y: 72 },
      { pos: 'CM', x: 25, y: 52 }, { pos: 'CM', x: 50, y: 56 }, { pos: 'CM', x: 75, y: 52 },
      { pos: 'LW', x: 15, y: 22 }, { pos: 'ST', x: 50, y: 16 }, { pos: 'RW', x: 85, y: 22 }
    ],
    '4-4-2': [
      { pos: 'GK', x: 50, y: 90 },
      { pos: 'LB', x: 15, y: 72 }, { pos: 'CB', x: 38, y: 76 }, { pos: 'CB', x: 62, y: 76 }, { pos: 'RB', x: 85, y: 72 },
      { pos: 'LM', x: 15, y: 45 }, { pos: 'CM', x: 38, y: 50 }, { pos: 'CM', x: 62, y: 50 }, { pos: 'RM', x: 85, y: 45 },
      { pos: 'ST', x: 38, y: 18 }, { pos: 'ST', x: 62, y: 18 }
    ],
    '3-5-2': [
      { pos: 'GK', x: 50, y: 90 },
      { pos: 'CB', x: 25, y: 76 }, { pos: 'CB', x: 50, y: 78 }, { pos: 'CB', x: 75, y: 76 },
      { pos: 'LWB', x: 10, y: 50 }, { pos: 'CM', x: 35, y: 55 }, { pos: 'CM', x: 50, y: 58 }, { pos: 'CM', x: 65, y: 55 }, { pos: 'RWB', x: 90, y: 50 },
      { pos: 'ST', x: 38, y: 18 }, { pos: 'ST', x: 62, y: 18 }
    ],
    '5-3-2': [
      { pos: 'GK', x: 50, y: 90 },
      { pos: 'LWB', x: 8, y: 65 }, { pos: 'CB', x: 28, y: 78 }, { pos: 'CB', x: 50, y: 80 }, { pos: 'CB', x: 72, y: 78 }, { pos: 'RWB', x: 92, y: 65 },
      { pos: 'CM', x: 30, y: 52 }, { pos: 'CM', x: 50, y: 56 }, { pos: 'CM', x: 70, y: 52 },
      { pos: 'ST', x: 38, y: 18 }, { pos: 'ST', x: 62, y: 18 }
    ]
  };

  const BENCH_SIZE = 7;
  const STORAGE_KEY = 'football_lineup_builder_v2';

  let state = {
    formation: '4-2-3-1',
    team: 'MADRID TV SHOW',
    lineup: [],
    bench: []
  };

  let editing = null; // { type: 'lineup'|'bench', index: number }
  let tempPhoto = null;

  // ==================== UTILS ====================
  function blankPlayer() {
    return { name: '', pos: '', rating: 0, type: 'normal', photo: null, flag: '' };
  }

  function initState() {
    const f = FORMATIONS[state.formation];
    state.lineup = f.map(p => {
      const o = blankPlayer();
      o.pos = p.pos;
      return o;
    });
    state.bench = Array.from({ length: BENCH_SIZE }, () => blankPlayer());
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    try {
      const data = JSON.parse(raw);
      if (!data || !FORMATIONS[data.formation]) return false;
      state = data;
      if (state.lineup.length !== FORMATIONS[state.formation].length) {
        state.lineup = FORMATIONS[state.formation].map((p, i) => {
          const old = state.lineup[i] || blankPlayer();
          old.pos = p.pos;
          return old;
        });
      }
      if (state.bench.length !== BENCH_SIZE) {
        state.bench = Array.from({ length: BENCH_SIZE }, (_, i) => state.bench[i] || blankPlayer());
      }
      return true;
    } catch (e) { return false; }
  }

  // ==================== RENDER ====================
  function render() {
    // Update headers
    document.getElementById('teamTitleDisplay').textContent = state.team || 'MADRID TV SHOW';
    document.getElementById('formationBadge').textContent = state.formation;
    document.getElementById('formationSelect').value = state.formation;
    document.getElementById('teamNameInput').value = state.team;

    // Render Lineup
    const f = FORMATIONS[state.formation];
    const grid = document.getElementById('playersGrid');
    grid.innerHTML = state.lineup.map((p, i) => {
      const pos = f[i];
      const photoHtml = p.photo 
        ? `<img src="${p.photo}" class="card-img" alt="">` 
        : `<div class="card-img-placeholder">👤</div>`;
      
      const ratingVal = Number(p.rating || 0).toFixed(1);
      const displayName = p.name ? p.name : '---';
      
      return `
        <div class="card type-${p.type}" style="left: ${pos.x}%; top: ${pos.y}%;" data-type="lineup" data-index="${i}">
          <div class="card-gradient"></div>
          ${photoHtml}
          <div class="card-rating">${ratingVal}</div>
          <div class="card-pos">${p.pos}</div>
          ${p.flag ? `<div class="card-flag">${p.flag}</div>` : ''}
          <div class="card-name">${displayName}</div>
        </div>
      `;
    }).join('');

    // Render Bench
    const benchSlots = document.getElementById('benchSlots');
    benchSlots.innerHTML = state.bench.map((p, i) => {
      const photoHtml = p.photo 
        ? `<img src="${p.photo}" class="card-img" alt="">` 
        : `<div class="card-img-placeholder">👤</div>`;
      
      const ratingVal = Number(p.rating || 0).toFixed(1);
      const displayName = p.name ? p.name : '---';
      
      return `
        <div class="card type-${p.type}" data-type="bench" data-index="${i}">
          <div class="card-gradient"></div>
          ${photoHtml}
          <div class="card-rating">${ratingVal}</div>
          <div class="card-pos">${p.pos || 'SUB'}</div>
          ${p.flag ? `<div class="card-flag">${p.flag}</div>` : ''}
          <div class="card-name">${displayName}</div>
        </div>
      `;
    }).join('');
  }

  // ==================== MODAL ====================
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const nameInput = document.getElementById('nameInput');
  const flagInput = document.getElementById('flagInput');
  const posInput = document.getElementById('posInput');
  const ratingInput = document.getElementById('ratingInput');
  const typeSelect = document.getElementById('typeSelect');
  const photoInput = document.getElementById('photoInput');

  function openModal(type, index) {
    editing = { type, index };
    const p = type === 'lineup' ? state.lineup[index] : state.bench[index];
    if (!p) return;

    modalTitle.textContent = type === 'lineup' ? `ویرایش بازیکن (پست: ${p.pos})` : `ویرایش بازیکن نیمکت #${index + 1}`;
    nameInput.value = p.name || '';
    flagInput.value = p.flag || '';
    posInput.value = p.pos || '';
    ratingInput.value = p.rating || 0;
    typeSelect.value = p.type || 'normal';
    tempPhoto = p.photo || null;
    photoInput.value = '';

    modal.classList.add('open');
  }

  function closeModal() {
    modal.classList.remove('open');
    editing = null;
    tempPhoto = null;
  }

  function saveModal() {
    if (!editing) return;
    const p = editing.type === 'lineup' ? state.lineup[editing.index] : state.bench[editing.index];
    
    let rating = parseFloat(ratingInput.value);
    if (isNaN(rating)) rating = 0;
    rating = Math.min(10, Math.max(0, Math.round(rating * 2) / 2));

    p.name = nameInput.value.trim();
    p.flag = flagInput.value.trim();
    p.pos = posInput.value.trim().toUpperCase();
    p.rating = rating;
    p.type = typeSelect.value;
    p.photo = tempPhoto;

    closeModal();
    render();
    save();
  }

  // ==================== EVENT LISTENERS ====================
  document.getElementById('playersGrid').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card) openModal('lineup', Number(card.dataset.index));
  });

  document.getElementById('benchSlots').addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card) openModal('bench', Number(card.dataset.index));
  });

  document.getElementById('saveBtn').addEventListener('click', saveModal);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('deleteBtn').addEventListener('click', () => {
    tempPhoto = null;
    photoInput.value = '';
    alert('عکس حذف شد. برای اعمال تغییرات، ذخیره کنید.');
  });

  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  
  // Photo Upload
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          const r = Math.min(MAX / w, MAX / h);
          w *= r; h *= r;
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        tempPhoto = canvas.toDataURL('image/png');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // Formation & Team Name
  document.getElementById('formationSelect').addEventListener('change', (e) => {
    state.formation = e.target.value;
    const f = FORMATIONS[state.formation];
    state.lineup = f.map((pos, i) => {
      const old = state.lineup[i] || blankPlayer();
      old.pos = pos.pos;
      return old;
    });
    render();
    save();
  });

  document.getElementById('teamNameInput').addEventListener('input', (e) => {
    state.team = e.target.value;
    document.getElementById('teamTitleDisplay').textContent = state.team || 'MADRID TV SHOW';
    save();
  });

  // Reset
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('آیا از پاک کردن تمام اطلاعات مطمئن هستید؟')) {
      localStorage.removeItem(STORAGE_KEY);
      state = { formation: '4-2-3-1', team: 'MADRID TV SHOW', lineup: [], bench: [] };
      initState();
      render();
    }
  });

  // Export Image
  document.getElementById('exportBtn').addEventListener('click', () => {
    const btn = document.getElementById('exportBtn');
    const originalText = btn.textContent;
    btn.textContent = '⏳ در حال ساخت...';
    btn.disabled = true;

    html2canvas(document.getElementById('board'), {
      backgroundColor: '#0a1118',
      scale: 2,
      useCORS: true,
      logging: false
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `lineup-${state.formation}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => {
      alert('خطا در ساخت تصویر: ' + err.message);
    }).finally(() => {
      btn.textContent = originalText;
      btn.disabled = false;
    });
  });

  // Drag & Drop Photo on Cards
  document.addEventListener('dragover', (e) => {
    if (e.target.closest('.card')) e.preventDefault();
  });
  document.addEventListener('drop', (e) => {
    const card = e.target.closest('.card');
    if (!card) return;
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          const r = Math.min(MAX / w, MAX / h);
          w *= r; h *= r;
        }
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        
        const type = card.dataset.type;
        const idx = Number(card.dataset.index);
        const p = type === 'lineup' ? state.lineup[idx] : state.bench[idx];
        if (p) {
          p.photo = canvas.toDataURL('image/png');
          render();
          save();
        }
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ==================== START ====================
  if (!load()) {
    initState();
  }
  render();
</script>
</body>
</html>
