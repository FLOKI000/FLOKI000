<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سازنده ترکیب فوتبال | FIFA 27 Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #060a10;
    --pitch-green: #0b2626;
    --pitch-line: rgba(255, 255, 255, 0.17);
    --accent: #00d8a0;
    --accent-2: #00b4ff;
    --text-sub: #8fa3c0;
    --danger: #ef4444;
    --shield: polygon(50% 0%, 100% 15%, 100% 65%, 88% 82%, 67% 94%, 50% 100%, 33% 94%, 12% 82%, 0% 65%, 0% 15%);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { width: 100%; }

  body {
    font-family: 'Vazirmatn', 'Montserrat', sans-serif;
    background: var(--bg-dark);
    background-image:
      radial-gradient(circle at 50% 0%, rgba(0, 216, 160, 0.15), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(0, 180, 255, 0.08), transparent 45%),
      linear-gradient(180deg, #0a1118 0%, #05080d 100%);
    background-attachment: fixed;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 10px 40px;
    overflow-x: hidden;
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    background: rgba(13, 43, 43, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 10px 14px;
    border-radius: 14px;
    border: 1px solid rgba(0, 216, 160, 0.22);
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }

  select, input[type="text"], input[type="number"] {
    font-family: 'Vazirmatn', sans-serif;
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: #fff;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 13px;
    outline: none;
    transition: 0.25s;
  }
  select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,216,160,.15); }
  select option { background: #0a1118; }

  .btn {
    font-family: 'Vazirmatn', sans-serif;
    background: linear-gradient(135deg, #00d8a0, #00a87d);
    color: #04120d;
    font-weight: 700;
    border: none;
    padding: 8px 14px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 13px;
    transition: 0.25s;
    box-shadow: 0 4px 14px rgba(0, 216, 160, 0.28);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 216, 160, 0.45); }
  .btn:active:not(:disabled) { transform: translateY(0); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: rgba(255, 255, 255, 0.09); color: #fff; box-shadow: none; }
  .btn.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.18); transform: none; }
  .btn.icon { padding: 8px 11px; font-size: 15px; line-height: 1; }
  .btn-danger { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.45); box-shadow: none; }
  .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.35); }

  /* ============ BOARD ============ */
  .board-container {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ============ PITCH ============ */
  .pitch-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 0.72;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid rgba(0, 216, 160, 0.22);
    background: var(--pitch-green);
    box-shadow: 0 18px 45px rgba(0,0,0,0.75), inset 0 0 120px rgba(0,0,0,0.55);
  }

  .pitch-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(90deg, transparent 50%, rgba(0, 216, 160, 0.035) 50%),
      linear-gradient(180deg, rgba(0, 216, 160, 0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 216, 160, 0.045) 1px, transparent 1px);
    background-size: 10px 10px, 22px 22px, 22px 22px;
    z-index: 0;
  }
  .pitch-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, transparent 25%, rgba(0,0,0,0.62) 100%);
  }

  .pitch-lines {
    position: absolute;
    inset: 4%;
    border: 2px solid var(--pitch-line);
    border-radius: 10px;
    z-index: 1;
    pointer-events: none;
  }
  .pitch-lines .center-line { position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--pitch-line); }
  .pitch-lines .center-circle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 26%; aspect-ratio: 1; border: 2px solid var(--pitch-line); border-radius: 50%;
  }
  .pitch-lines .penalty-box {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 52%; height: 15%; border: 2px solid var(--pitch-line);
  }
  .pitch-lines .penalty-box.top { top: 0; border-top: none; }
  .pitch-lines .penalty-box.bottom { bottom: 0; border-bottom: none; }
  .pitch-lines .six-yard-box {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 26%; height: 6.5%; border: 2px solid var(--pitch-line);
  }
  .pitch-lines .six-yard-box.top { top: 0; border-top: none; }
  .pitch-lines .six-yard-box.bottom { bottom: 0; border-bottom: none; }
  .pitch-lines .penalty-spot {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 4px; height: 4px; background: var(--pitch-line); border-radius: 50%;
  }
  .pitch-lines .penalty-spot.top { top: 11%; }
  .pitch-lines .penalty-spot.bottom { bottom: 11%; }

  .pitch-header {
    position: absolute;
    top: 3.5%;
    left: 5%;
    right: 5%;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    pointer-events: none;
    direction: ltr;
  }
  .team-title {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(12px, 4vw, 26px);
    font-style: italic;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.1;
    background: linear-gradient(135deg, #ffffff 0%, #00d8a0 40%, #00b4ff 70%, #ffd700 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 12px rgba(0,0,0,0.95)) drop-shadow(0 1px 2px rgba(0,0,0,1));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
    flex: 1 1 auto;
    min-width: 0;
  }
  .formation-badge {
    flex: 0 0 auto;
    background: var(--accent);
    color: #04120d;
    font-weight: 900;
    font-size: clamp(9px, 2.4vw, 12px);
    padding: 3px 10px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    letter-spacing: .5px;
    box-shadow: 0 3px 10px rgba(0,216,160,.4);
    align-self: center;
  }

  .players-grid { position: absolute; inset: 0; z-index: 5; }

  /* =========================================================
     ============  FIFA 27 CARD  =============================
     ========================================================= */
  .card {
    position: absolute;
    width: clamp(42px, 13%, 82px);
    aspect-ratio: 0.72;
    transform: translate(-50%, -50%);
    cursor: pointer;
    z-index: 10;
    container-type: inline-size;
    direction: ltr;
    transition: transform .22s cubic-bezier(.175,.885,.32,1.275), filter .2s;
    clip-path: var(--shield);
    background: var(--frame);
    padding: 1.5px;
    filter: drop-shadow(0 5px 9px rgba(0,0,0,.6));
    will-change: transform;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    outline: none;
  }
  .card:focus-visible { filter: drop-shadow(0 0 0 2px var(--accent)) drop-shadow(0 5px 9px rgba(0,0,0,.6)); }
  .card:hover {
    transform: translate(-50%, -50%) scale(1.09);
    z-index: 60;
    filter: drop-shadow(0 8px 16px rgba(0,0,0,.75)) brightness(1.08);
  }
  .card.dragging {
    opacity: .35;
    transform: translate(-50%, -50%) scale(0.94);
  }

  .card.drop-target::before {
    content: '';
    position: absolute;
    inset: -4px;
    border: 2px dashed var(--accent);
    border-radius: 8px;
    animation: pulse 0.9s infinite;
    pointer-events: none;
    z-index: 100;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .card-body {
    position: relative;
    width: 100%;
    height: 100%;
    clip-path: var(--shield);
    background: var(--body);
    overflow: hidden;
    display: block;
  }

  .card-body::after {
    content: '';
    position: absolute;
    top: -30%;
    left: -60%;
    width: 60%;
    height: 160%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.22), transparent);
    transform: rotate(18deg);
    pointer-events: none;
    z-index: 6;
  }

  .card-img {
    position: absolute;
    left: 0; right: 0;
    top: 8%;
    width: 100%;
    height: 92%;
    object-fit: cover;
    object-position: 50% 12%;
    z-index: 1;
    display: block;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .card-ph {
    position: absolute;
    left: 0; right: 0;
    top: 20%;
    bottom: 6%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ph);
    z-index: 1;
  }
  .card-ph svg { width: 62%; height: 62%; }

  .card-shade {
    position: absolute;
    inset: 0;
    z-index: 2;
    background: linear-gradient(to bottom,
      var(--shade-top) 0%,
      transparent 26%,
      transparent 52%,
      var(--shade-bot) 100%);
    pointer-events: none;
  }

  .card-top {
    position: absolute;
    top: 9%;
    left: 9%;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .card-rating {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(11px, 26cqw, 22px);
    color: var(--accent-txt);
    letter-spacing: -0.5px;
    text-shadow: var(--tsh);
  }
  .card-pos {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(6px, 11cqw, 9px);
    color: var(--accent-txt);
    letter-spacing: 0.5px;
    margin-top: 2px;
    opacity: .95;
    text-shadow: var(--tsh);
  }

  .card-foot {
    position: absolute;
    left: 10%;
    right: 10%;
    bottom: 15%;
    z-index: 5;
    text-align: center;
  }
  .card-name {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: clamp(5px, 11cqw, 9px);
    color: var(--accent-txt);
    text-transform: uppercase;
    letter-spacing: 0.2px;
    line-height: 1.05;
    text-shadow: var(--tsh);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
    padding: 0 2px;
  }

  /* ---------- 4 CARD TYPES ---------- */
  .card.type-bronze {
    --frame: linear-gradient(160deg, #e4a86b, #7a4a1c);
    --body: linear-gradient(165deg, #b87536 0%, #8a4f1d 55%, #4a2810 100%);
    --accent-txt: #ffe9ce;
    --tsh: 0 1px 3px rgba(0,0,0,.8);
    --shade-top: rgba(40,18,0,.45);
    --shade-bot: rgba(30,12,0,.9);
    --ph: rgba(255,255,255,.22);
  }
  .card.type-silver {
    --frame: linear-gradient(160deg, #ffffff, #8b93a0);
    --body: linear-gradient(165deg, #e9edf2 0%, #b5bcc6 55%, #7d8590 100%);
    --accent-txt: #1c222a;
    --tsh: 0 1px 1px rgba(255,255,255,.65);
    --shade-top: rgba(255,255,255,.5);
    --shade-bot: rgba(255,255,255,.93);
    --ph: rgba(0,0,0,.15);
  }
  .card.type-gold {
    --frame: linear-gradient(160deg, #fff7cf, #9d7514);
    --body: linear-gradient(165deg, #fbde82 0%, #d3a52c 55%, #8a6410 100%);
    --accent-txt: #2a1f05;
    --tsh: 0 1px 1px rgba(255,255,255,.55);
    --shade-top: rgba(255,245,200,.5);
    --shade-bot: rgba(255,246,205,.95);
    --ph: rgba(0,0,0,.16);
  }
  .card.type-legend {
    --frame: linear-gradient(160deg, #ffe08a, #7c3aed);
    --body: linear-gradient(165deg, #2a1a4a 0%, #170a2e 55%, #06010f 100%);
    --accent-txt: #ffd76b;
    --tsh: 0 1px 3px rgba(0,0,0,.95);
    --shade-top: rgba(10,0,30,.55);
    --shade-bot: rgba(8,0,24,.95);
    --ph: rgba(255,215,107,.24);
  }
  .card.type-legend .card-body::before {
    content: '';
    position: absolute;
    inset: 8% 10% 28% 10%;
    border: 1px solid rgba(255,215,107,.28);
    border-radius: 50% 50% 42% 42%;
    z-index: 3;
    pointer-events: none;
  }
  .card.type-legend {
    filter: drop-shadow(0 5px 9px rgba(0,0,0,.7)) drop-shadow(0 0 8px rgba(255,215,107,.15));
  }

  /* =========================================================
     ============  PANELS  ===================================
     ========================================================= */
  .panel {
    width: 100%;
    background: rgba(13, 43, 43, 0.55);
    border: 1px solid rgba(0, 216, 160, 0.2);
    border-radius: 15px;
    padding: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transition: border-color .2s, box-shadow .2s;
  }

  .subs-panel.drop-hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(0,216,160,.35);
    background: rgba(0, 216, 160, 0.08);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .panel-title {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title::before {
    content: '';
    width: 4px; height: 14px;
    background: var(--accent);
    border-radius: 2px;
    display: block;
  }
  .panel-count {
    background: rgba(0,216,160,.16);
    color: var(--accent);
    font-size: 11px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 20px;
    font-family: 'Montserrat', sans-serif;
  }
  .panel-actions { display: flex; gap: 6px; }
  .btn-mini {
    font-family: 'Vazirmatn', sans-serif;
    background: rgba(0, 216, 160, 0.14);
    border: 1px solid rgba(0, 216, 160, 0.4);
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: .2s;
    white-space: nowrap;
  }
  .btn-mini:hover { background: rgba(0,216,160,.28); }
  .btn-mini.danger { color: #fca5a5; border-color: rgba(239,68,68,.45); background: rgba(239,68,68,.14); }
  .btn-mini.danger:hover { background: rgba(239,68,68,.28); }

  .slot-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 2px 10px;
    min-height: 100px;
    scrollbar-width: thin;
  }
  .slot-row::-webkit-scrollbar { height: 6px; }
  .slot-row::-webkit-scrollbar-track { background: rgba(255,255,255,.05); border-radius: 3px; }
  .slot-row::-webkit-scrollbar-thumb { background: rgba(0, 216, 160, 0.35); border-radius: 3px; }

  .slot-row .card {
    position: relative;
    left: auto !important;
    top: auto !important;
    transform: none;
    flex: 0 0 auto;
    width: 74px;
  }
  .slot-row .card:hover { transform: translateY(-4px) scale(1.05); z-index: 60; }
  .slot-row .card.dragging { transform: scale(.94); }

  .sub-card { position: relative; flex: 0 0 auto; }
  .sub-remove {
    position: absolute;
    top: -6px;
    right: -4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    border: 2px solid #0d1b1b;
    font-size: 13px;
    font-weight: 900;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 70;
    font-family: 'Montserrat', sans-serif;
    transition: .2s;
    padding: 0;
    touch-action: manipulation;
  }
  .sub-remove:hover { transform: scale(1.15); background: #ff5b5b; }

  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 80px;
    border: 2px dashed rgba(0, 216, 160, 0.22);
    border-radius: 12px;
    color: var(--text-sub);
    font-size: 12.5px;
    text-align: center;
    padding: 16px;
    line-height: 1.7;
  }

  /* ============ BENCH GROUPS ============ */
  .bench-groups {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bench-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .bench-group-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 6px;
    padding-right: 4px;
  }
  .bench-group-title .group-count {
    background: rgba(255,255,255,.08);
    color: #cfe;
    font-size: 10px;
    padding: 1px 7px;
    border-radius: 10px;
    font-family: 'Montserrat', sans-serif;
  }
  .bench-group .slot-row {
    min-height: auto;
    padding-top: 4px;
    padding-bottom: 4px;
  }

  /* ============ DRAG GHOST ============ */
  .drag-ghost {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 78px;
    aspect-ratio: 0.72;
    transform: translate(-50%, -50%) scale(1.06) rotate(-3deg);
    filter: drop-shadow(0 18px 28px rgba(0,0,0,.8));
    opacity: 0.92;
    will-change: left, top;
  }
  .drag-ghost .card {
    position: relative !important;
    left: 0 !important;
    top: 0 !important;
    width: 100%;
    transform: none;
    cursor: grabbing;
  }
  .drag-ghost .card:hover { transform: none; }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 15px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #0d1a26;
    border: 1px solid rgba(0, 216, 160, 0.3);
    border-radius: 16px;
    width: 100%;
    max-width: 400px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.9);
    animation: pop .28s cubic-bezier(.175,.885,.32,1.275);
    margin: auto;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-box h3 { font-size: 15px; font-weight: 900; margin-bottom: 6px; color: #fff; text-align: center; }

  .player-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 8px 12px;
    background: rgba(0,216,160,.08);
    border: 1px solid rgba(0,216,160,.22);
    border-radius: 10px;
    direction: ltr;
  }
  .player-badge .pname {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: #fff;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .player-badge .ppos {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 11px;
    color: var(--accent);
    background: rgba(0,216,160,.15);
    padding: 2px 8px;
    border-radius: 5px;
  }

  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 11.5px; color: var(--text-sub); margin-bottom: 5px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 9px; color: #fff; font-family: inherit; font-size: 14px;
    outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: #0a1118; }

  .type-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);

/* =========================================================
   1) SHIELD SHAPE  →  گرد کردن لبه‌های تیز کارت (اصلاح‌شده)
   ========================================================= */
(function buildRoundedShield() {
  // نقاط اصلی سپر (درصدی)
  const BASE = [
    [50, 0], [100, 15], [100, 65], [88, 82], [67, 94],
    [50, 100], [33, 94], [12, 82], [0, 65], [0, 15]
  ];

  const CARD_ASPECT = 0.72;          // width / height
  const W = 100;                      // مقیاس عرض
  const H = W / CARD_ASPECT;          // = 138.9 → مقیاس ارتفاع
  const RADIUS_PX = 11;               // شعاع گردی در فضای پیکسلیِ هم‌مقیاس
  const STEPS = 8;

  // تبدیل به فضای پیکسلی (هم‌مقیاس)
  const px = BASE.map(p => [p[0] * W / 100, p[1] * H / 100]);
  const n = px.length;
  const out = [];

  for (let i = 0; i < n; i++) {
    const prev = px[(i - 1 + n) % n];
    const cur  = px[i];
    const next = px[(i + 1) % n];

    const v1 = [prev[0] - cur[0], prev[1] - cur[1]];
    const v2 = [next[0] - cur[0], next[1] - cur[1]];
    const l1 = Math.hypot(v1[0], v1[1]) || 1;
    const l2 = Math.hypot(v2[0], v2[1]) || 1;

    const r1 = Math.min(RADIUS_PX, l1 / 2);
    const r2 = Math.min(RADIUS_PX, l2 / 2);

    const pA = [cur[0] + (v1[0] / l1) * r1, cur[1] + (v1[1] / l1) * r1];
    const pB = [cur[0] + (v2[0] / l2) * r2, cur[1] + (v2[1] / l2) * r2];

    // منحنی درجه دو از pA به pB با نقطه کنترل cur
    for (let s = 0; s <= STEPS; s++) {
      const t  = s / STEPS;
      const mt = 1 - t;
      const x = mt * mt * pA[0] + 2 * mt * t * cur[0] + t * t * pB[0];
      const y = mt * mt * pA[1] + 2 * mt * t * cur[1] + t * t * pB[1];
      out.push([x * 100 / W, y * 100 / H]);
    }
  }

  const poly = 'polygon(' + out
    .map(p => `${p[0].toFixed(3)}% ${p[1].toFixed(3)}%`)
    .join(', ') + ')';

  document.documentElement.style.setProperty('--shield', poly);
})();

function blankPlayer(pos) {
  return { name: '', pos: pos || '', rating: 0, type: 'silver', photo: null, number: null };
}

function rosterToPlayer(number, overridePos) {
  const r = RM_ROSTER[number];
  if (!r) return blankPlayer(overridePos);
  return {
    name: r.name,
    pos: overridePos || r.pos,
    rating: r.rating,
    type: r.type,
    photo: PHOTO_BASE + number + '.PNG',
    number: number
  };
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function getZoneArray(zone) {
  if (zone === 'lineup') return state.lineup;
  if (zone === 'bench')  return state.bench;
  if (zone === 'sub')    return state.subs;
  return null;
}

function getPlayer(zone, index) {
  const arr = getZoneArray(zone);
  return arr ? arr[index] : null;
}

  const starterSet = new Set(RM_STARTING_XI);
  state.bench = Object.keys(RM_ROSTER)
    .map(Number)
    .filter(num => !starterSet.has(num))
    .sort((a, b) => a - b)
    .map(num => rosterToPlayer(num));

  state.subs = [];
}

function snapshot() {
  return JSON.stringify({
    formation: state.formation,
    team: state.team,
    lineup: state.lineup,
    bench: state.bench,
    subs: state.subs
  });
}

function pushHistory() {
  if (isApplyingHistory) return;
  history = history.slice(0, historyPtr + 1);
  history.push(snapshot());
  historyPtr = history.length - 1;
  if (history.length > MAX_HISTORY) {
    history.shift();
    historyPtr--;
  }
  updateHistoryButtons();
}

function undo() {
  if (historyPtr <= 0) return;
  historyPtr--;
  applyHistory(history[historyPtr]);
  toast('بازگردانی شد');
}

function redo() {
  if (historyPtr >= history.length - 1) return;
  historyPtr++;
  applyHistory(history[historyPtr]);
  toast('ازنو انجام شد');
}

function applyHistory(snap) {
  isApplyingHistory = true;
  try {
    const data = JSON.parse(snap);
    state.formation = data.formation;
    state.team = data.team;
    state.lineup = data.lineup;
    state.bench = data.bench;
    state.subs = data.subs;
    render();
    save();
  } finally {
    isApplyingHistory = false;
  }
  updateHistoryButtons();
}

function updateHistoryButtons() {

    if (!Array.isArray(data.subs)) data.subs = [];
    if (!Array.isArray(data.lineup)) data.lineup = [];
    if (!Array.isArray(data.bench))  data.bench = [];

    const f = FORMATIONS[state.formation];
    state.lineup = f.map((p, i) => {
      const old = data.lineup[i] || blankPlayer();
      if (!VALID_TYPES.includes(old.type)) old.type = 'silver';
      return old;
    });
    state.bench = data.bench.map(p => {
      if (!VALID_TYPES.includes(p.type)) p.type = 'silver';
      return p;
    });
    state.subs = data.subs.map(p => {
      if (!VALID_TYPES.includes(p.type)) p.type = 'silver';
      return p;
    });
    return true;
  } catch (e) { return false; }
}

/* =========================================================
   CARD RENDERER
   ========================================================= */
function cardHTML(p, zone, idx, extraStyle, extraClass) {
  const r = Number(p.rating) || 0;
  const ratingTxt = r > 0 ? (r % 1 === 0 ? r.toFixed(0) : r.toFixed(1)) : '–';
  const nameTxt   = (p.name || '').trim() ? escapeHtml(p.name.trim()) : '—';
  const posTxt    = (p.pos  || '').trim() ? escapeHtml(p.pos.trim().toUpperCase()) : '—';
  const typeCls   = VALID_TYPES.includes(p.type) ? p.type : 'silver';

  const media = p.photo
    ? `<img class="card-img" src="${escapeHtml(p.photo)}" alt="" crossorigin="anonymous" onerror="this.onerror=null;this.outerHTML='<div class=\\'card-ph\\'><svg viewBox=\\'0 0 24 24\\' fill=\\'currentColor\\'><path d=\\'M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.97 0-9 2.69-9 6v2h18v-2c0-3.31-4.03-6-9-6Z\\'/></svg></div>'">`
    : `<div class="card-ph"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.97 0-9 2.69-9 6v2h18v-2c0-3.31-4.03-6-9-6Z"/></svg></div>`;

  const ariaLabel = `${nameTxt}، پست ${posTxt}، امتیاز ${ratingTxt}`;

  return `
    <div class="card type-${typeCls} ${extraClass || ''}"
         data-zone="${zone}" data-index="${idx}"
         role="button" tabindex="0"
         aria-label="${escapeHtml(ariaLabel)}"
         style="${extraStyle || ''}">
      <div class="card-body">
        ${media}
        <div class="card-shade"></div>
        <div class="card-top">
          <div class="card-rating">${ratingTxt}</div>
          <div class="card-pos">${posTxt}</div>
        </div>
        <div class="card-foot">
          <span class="card-name">${nameTxt}</span>
        </div>
      </div>
    </div>`;
}

function render() {
  document.getElementById('teamTitleDisplay').textContent = state.team || 'MADRID TV SHOW';
  document.getElementById('formationBadge').textContent = state.formation;
  document.getElementById('formationSelect').value = state.formation;
  document.getElementById('teamNameInput').value = state.team;

  const f = FORMATIONS[state.formation];
  document.getElementById('playersGrid').innerHTML = state.lineup.map((p, i) => {
    const slot = f[i] || { x: 50, y: 50, pos: '?' };
    const displayP = { ...p, pos: slot.pos };
    return cardHTML(displayP, 'lineup', i, `left:${slot.x}%;top:${slot.y}%;`);
  }).join('');

  // -------- SUBS --------
  const subsWrap = document.getElementById('subsSlots');
  if (state.subs.length === 0) {
    subsWrap.innerHTML = `<div class="empty-state">هنوز بازیکن تعویضی اضافه نشده است<br>از لیست «ذخیره» یک بازیکن را بکشید و به اینجا رها کنید</div>`;
  } else {
    subsWrap.innerHTML = state.subs.map((p, i) => `
      <div class="sub-card">
        ${cardHTML(p, 'sub', i)}
        <button class="sub-remove" data-remove="${i}" aria-label="حذف تعویضی" title="حذف">×</button>
      </div>
    `).join('');
  }

  // -------- BENCH (grouped) --------
  const groups = { GK: [], DEF: [], MID: [], FWD: [] };
  state.bench.forEach((p, i) => {
    const posUp = (p.pos || '').toUpperCase();
    const g = POS_GROUP[posUp] || 'MID';
    groups[g].push({ p, i });
  });

  const benchWrap = document.getElementById('benchSlots');
  benchWrap.innerHTML = ['GK', 'DEF', 'MID', 'FWD'].map(g => {
    const list = groups[g];
    if (!list.length) return '';
    return `
      <div class="bench-group">
        <div class="bench-group-title">${GROUP_LABELS[g]} <span class="group-count">${list.length}</span></div>
        <div class="slot-row">
          ${list.map(({ p, i }) => cardHTML(p, 'bench', i)).join('')}
        </div>
      </div>`;
  }).join('') || `<div class="empty-state">لیست ذخیره خالی است</div>`;

  const benchFilled = state.bench.filter(p => (p.name || '').trim() || p.photo).length;
  document.getElementById('benchCount').textContent = benchFilled;
  document.getElementById('subsCount').textContent = state.subs.length;

  updateHistoryButtons();

/* =========================================================
   IMAGE PROCESSING
   ========================================================= */
function processImageFile(file, cb) {
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 420;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) {
        const r = Math.min(MAX / w, MAX / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/png'));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

/* =========================================================
   DRAG & DROP
   ========================================================= */
let dragSource = null;
let dragGhost = null;
let dragMoved = false;
let dragJustEnded = false;
let currentDropTarget = null;

const DRAG_THRESHOLD = 6;

function handlePointerDown(e) {
  if (e.target.closest('.sub-remove')) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  const card = e.target.closest('.card');
  if (!card) return;
  if (!card.dataset.zone) return;

  dragSource = {
    zone: card.dataset.zone,
    index: Number(card.dataset.index),
    el: card,
    pointerId: e.pointerId,
    startX: e.clientX,
    startY: e.clientY
  };
  dragMoved = false;
  currentDropTarget = null;

  document.addEventListener('pointermove', handlePointerMove, { passive: false });
  document.addEventListener('pointerup', handlePointerUp);
  document.addEventListener('pointercancel', handlePointerUp);
}

function handlePointerMove(e) {
  if (!dragSource || e.pointerId !== dragSource.pointerId) return;

  const dx = e.clientX - dragSource.startX;
  const dy = e.clientY - dragSource.startY;
  const dist = Math.hypot(dx, dy);

  if (!dragMoved && dist < DRAG_THRESHOLD) return;

  if (!dragMoved) {
    dragMoved = true;
    dragSource.el.classList.add('dragging');
    document.body.style.cursor = 'grabbing';

    dragGhost = document.createElement('div');
    dragGhost.className = 'drag-ghost';
    dragGhost.innerHTML = dragSource.el.outerHTML;
    const clonedCard = dragGhost.querySelector('.card');
    if (clonedCard) clonedCard.classList.remove('dragging');
    document.body.appendChild(dragGhost);
  }

  e.preventDefault();

  if (dragGhost) {
    dragGhost.style.left = e.clientX + 'px';
    dragGhost.style.top = e.clientY + 'px';
  }

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const targetCard = el && el.closest('.card');
  const subsPanelEl = document.getElementById('subsPanel');

  if (targetCard && targetCard !== dragSource.el && targetCard.dataset.zone) {
    if (currentDropTarget !== targetCard) {
      if (currentDropTarget) currentDropTarget.classList.remove('drop-target');
      targetCard.classList.add('drop-target');
      currentDropTarget = targetCard;
    }
    if (subsPanelEl) subsPanelEl.classList.remove('drop-hover');
  } else {
    if (currentDropTarget) {
      currentDropTarget.classList.remove('drop-target');
      currentDropTarget = null;
    }
    // Highlight subs panel if source is bench and pointer is over subs panel
    if (dragSource.zone === 'bench' && el && el.closest('#subsPanel')) {
      if (subsPanelEl) subsPanelEl.classList.add('drop-hover');
    } else {
      if (subsPanelEl) subsPanelEl.classList.remove('drop-hover');
    }
  }
}

function handlePointerUp(e) {
  if (!dragSource || e.pointerId !== dragSource.pointerId) return;

  const wasDrag = dragMoved;
  const source = dragSource;

  if (dragGhost) { dragGhost.remove(); dragGhost = null; }
  if (source.el) source.el.classList.remove('dragging');
  if (currentDropTarget) { currentDropTarget.classList.remove('drop-target'); currentDropTarget = null; }
  const subsPanelEl = document.getElementById('subsPanel');
  if (subsPanelEl) subsPanelEl.classList.remove('drop-hover');
  document.body.style.cursor = '';
  document.removeEventListener('pointermove', handlePointerMove);
  document.removeEventListener('pointerup', handlePointerUp);
  document.removeEventListener('pointercancel', handlePointerUp);

  dragSource = null;
  dragMoved = false;

  if (wasDrag) {
    dragJustEnded = true;
    requestAnimationFrame(() => { dragJustEnded = false; });

    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetCard = el && el.closest('.card');

    if (targetCard && targetCard.dataset.zone) {
      const tZone = targetCard.dataset.zone;
      const tIdx  = Number(targetCard.dataset.index);
      if (tZone !== source.zone || tIdx !== source.index) {
        performSwap(source.zone, source.index, tZone, tIdx);
      }
    } else if (source.zone === 'bench' && el && el.closest('#subsPanel')) {
      // Drop bench player onto subs panel → move it
      pushHistory();
      const p = state.bench.splice(source.index, 1)[0];
      state.subs.push(p);
      render();
      save();
      toast('به تعویضی‌ها اضافه شد');
    }
  } else {
    if (!dragJustEnded) {
      openModal(source.zone, source.index);
    }
  }
}

function performSwap(srcZone, srcIdx, tgtZone, tgtIdx) {
  const a = getZoneArray(srcZone);
  const b = getZoneArray(tgtZone);
  if (!a || !b) return;
  if (a[srcIdx] === undefined || b[tgtIdx] === undefined) return;

  pushHistory();

  if (a === b) {
    [a[srcIdx], a[tgtIdx]] = [a[tgtIdx], a[srcIdx]];
  } else {
    [a[srcIdx], b[tgtIdx]] = [b[tgtIdx], a[srcIdx]];
  }

  render();
  save();
  toast('جابجا شد');
}

/* =========================================================
   EXPORT  (only pitch + subs, no bench, no editing buttons)
   ========================================================= */
function triggerDownload(dataUrl, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = dataUrl;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  const originalText = btn.innerHTML;
  btn.innerHTML = '⏳ در حال ساخت...';
  btn.disabled = true;

  const subsPanel = document.getElementById('subsPanel');
  const subsWasEmpty = state.subs.length === 0;

  document.body.classList.add('exporting');
  if (subsWasEmpty) subsPanel.classList.add('export-hide');

  const node = document.getElementById('board');
  const filename = `lineup-${state.formation}-${Date.now()}.png`;
  const scrollY = window.scrollY;
  window.scrollTo(0, 0);
  await new Promise(r => setTimeout(r, 120));

  try {
    let dataUrl = null;

    if (window.htmlToImage && typeof window.htmlToImage.toPng === 'function') {
      try {
        dataUrl = await window.htmlToImage.toPng(node, {
          pixelRatio: 2,
          backgroundColor: '#060a10',
          cacheBust: true,
          skipFonts: false
        });
      } catch (err) {
        console.warn('html-to-image failed, falling back…', err);
        dataUrl = null;
      }
    }

    if (!dataUrl) {
      const canvas = await html2canvas(node, {
        backgroundColor: '#060a10',
        scale: 2,
        useCORS: true,
        allowTaint: false,
        logging: false,
        windowWidth: node.scrollWidth,
        windowHeight: node.scrollHeight
      });
      dataUrl = canvas.toDataURL('image/png');
    }

    triggerDownload(dataUrl, filename);
    toast('عکس دانلود شد ✓');
  } catch (err) {
    alert('خطا در ساخت تصویر: ' + (err && err.message ? err.message : err));
  } finally {
    document.body.classList.remove('exporting');
    if (subsWasEmpty) subsPanel.classList.remove('export-hide');
    btn.innerHTML = originalText;
    btn.disabled = false;
    window.scrollTo(0, scrollY);
  }
});

(function start() {
  if (!load()) initState();
  if (!state.bench || state.bench.length === 0) {
    const starterSet = new Set(STARTERS = RM_STARTING_XI);
    state.bench = Object.keys(RM_ROSTER)
      .map(Number)
      .filter(num => !starterSet.has(num))
      .sort((a, b) => a - b)
      .map(num => rosterToPlayer(num));
  }
  history = [snapshot()];
  historyPtr = 0;
  render();
  updateHistoryButtons();
})();
</script>
</body>
</html>
